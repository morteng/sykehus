<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sykehustomta</title>
<meta name="description" content="Gamle Drammen sykehus i 3D og plan, etasje for etasje, fra arkivets tegninger">
<meta name="theme-color" content="#fbf9f4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbf9f4'/%3E%3Cpath d='M7 26V12h6V6h6v6h6v14z' fill='%2323211e'/%3E%3Cpath d='M15 9h2v2h-2zM15 15h2v2h-2zM10 15h2v2h-2zM20 15h2v2h-2zM15 21h2v5h-2z' fill='%23fbf9f4'/%3E%3C/svg%3E">
<style>
  :root { --ink: #23211e; --soft: #6c675f; --paper: #fbf9f4; --line: #d8d2c6; --red: #b0122b; --on: #23211e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #dfe8ee; color: var(--ink); font: 17px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #view { position: fixed; inset: 0; }
  .card { position: fixed; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px #0002; }
  #title { top: 14px; left: 14px; padding: 10px 16px; }
  #title h1 { margin: 0; font-size: 21px; font-weight: 600; }
  #title p { margin: 2px 0 0; color: var(--soft); font-size: 15px; }
  #bar { left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 14px; padding: 10px; align-items: center; max-width: calc(100vw - 24px); overflow-x: auto; }
  .group { display: flex; gap: 6px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  button { font: inherit; font-size: 17px; min-height: 46px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--soft); }
  button[aria-pressed="true"] { background: var(--on); color: #fff; border-color: var(--on); }
  button small { display: block; font-size: 13px; opacity: .75; line-height: 1; margin-top: -2px; }
  #north { top: 14px; right: 14px; width: 64px; height: 64px; display: grid; place-items: center; }
  #north svg { width: 46px; height: 46px; transition: transform .1s; }
  #zoom { top: 88px; right: 14px; width: 64px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  #zoom button { width: 100%; min-height: 50px; padding: 0; font-size: 26px; line-height: 1; }
  #scale { right: 14px; bottom: 96px; padding: 8px 12px 6px; font-size: 14px; display: none; }
  #scale .ticks { display: flex; height: 8px; border: 1.5px solid var(--ink); border-top: 0; margin-bottom: 2px; }
  #scale .ticks i { flex: 1; } #scale .ticks i:nth-child(odd) { background: var(--ink); }
  #scale .nums { display: flex; justify-content: space-between; }
  #info { left: 14px; bottom: 96px; padding: 12px 16px; min-width: 240px; display: none; max-height: calc(100vh - 200px); overflow-y: auto; }
  #info h2 { margin: 0 0 4px; font-size: 18px; }
  #info dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 15px; }
  #info dt { color: var(--soft); }
  #title a { color: var(--ink, #23211e); font-size: 14px; }
  #draft { top: 14px; left: 50%; transform: translateX(-50%); padding: 10px 16px; max-width: min(520px, calc(100vw - 340px)); font-size: 15px; background: #fff6d6; max-height: 40vh; overflow-y: auto; }
  #draft ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--soft); }
  #info { max-width: min(430px, calc(100vw - 28px)); }
  #info .x { position: absolute; top: 6px; right: 6px; min-height: 34px; width: 34px; padding: 0; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--soft); }
  #info .x:hover { color: var(--ink); }
  #info h2 { padding-right: 30px; }
  #info .src { margin: 8px 0 0; font-size: 13px; color: var(--soft); }
  #info .src ul { margin: 2px 0 0; padding-left: 16px; }
  #info .ideas { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  #info .ideas a { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); text-decoration: none; }
  #info .ideas a:hover { border-color: var(--soft); }
  #info .ideas small { display: block; color: var(--soft); font-size: 13px; }
  .lbl { align-self: center; font-size: 13px; color: var(--soft); padding: 0 2px 0 6px; }
  /* the first visit only: how to move about, gone at the first touch or after a while */
  #tip { top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 15px; color: var(--soft); pointer-events: none; transition: opacity .6s; }
  #tip.gone { opacity: 0; }
  @media (max-width: 640px) { .lbl { display: none; } #tip { top: auto; bottom: 230px; max-width: calc(100vw - 24px); text-align: center; } #draft { top: auto; bottom: 230px; max-width: calc(100vw - 24px); } #info, #scale { bottom: 150px; } #bar { flex-direction: column; gap: 8px; width: calc(100vw - 24px); } #bar .sep { display: none; } #floors { max-width: 100%; overflow-x: auto; } }
  /* signing in: the four digits, big */
  #code { font: 600 34px/1 ui-monospace, Menlo, monospace; letter-spacing: .35em; width: 5.2em; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; text-align: center; margin-right: 8px; }
  #info .err { color: var(--red); min-height: 1.2em; margin: 6px 0 0; }
  button.pri { background: var(--ink); border-color: var(--ink); color: #fff; }
  /* Anton: laser's pill (atomstack hurricane/server/web/laser.css .pill, 2026-10-25), larger; the talk above it */
  #anton { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(620px, calc(100vw - 28px)); display: flex; flex-direction: column; gap: 8px; }
  body.anton #info, body.anton #scale { bottom: 170px; }
  body.anton #info { max-height: calc(100vh - 280px); }
  #anton .pill { position: static; display: flex; align-items: flex-end; gap: 6px; min-height: 56px; padding: 6px; border-radius: 14px; }
  #anton .pill:has(textarea:focus) { border-color: var(--ink); }
  #anton .pillmid { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; align-self: center; padding: 0 6px; }
  #anton textarea { width: 100%; border: 0; background: transparent; resize: none; font: inherit; font-size: 18px; line-height: 24px; padding: 8px 2px; max-height: 118px; overflow-y: auto; outline: none; color: var(--ink); }
  #anton .busy { margin: 0 2px; font-size: 14px; color: var(--soft); } #anton .busy:empty { display: none; }
  #anton .hist, #anton .round { flex: none; display: grid; place-items: center; width: 46px; height: 46px; min-height: 0; padding: 0; border-radius: 12px; border: 0; }
  #anton .hist { background: transparent; color: var(--soft); } #anton .hist:hover { background: #0000000d; color: var(--ink); }
  #anton .round { background: var(--ink); color: #fff; } #anton .round.stop { background: var(--red); }
  #anton svg { width: 52%; height: 52%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #anton svg .f { fill: currentColor; stroke: none; }
  #talk { position: static; max-height: min(45vh, 420px); overflow-y: auto; padding: 10px 14px; }
  #talkLog { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 17px; }
  #talkLog b { display: block; font-size: 13px; color: var(--soft); font-weight: 600; }
  #talkLog .from-me { justify-self: end; max-width: 85%; background: #ecebe6; padding: 8px 12px; border-radius: 12px; }
  #talkLog .from-anton div { white-space: pre-wrap; }
  #talkLog .tool { font-size: 14px; color: var(--soft); }
  #talkLog .err { color: var(--red); font-size: 15px; }
  #talkLog .ask { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fff; }
  #talkLog .acts { display: flex; gap: 8px; margin-top: 8px; }
  @media (max-width: 640px) { #anton { bottom: 150px; } body.anton #info, body.anton #scale { bottom: 230px; } }
  @media print { #anton { display: none !important; } }
  #sheet { display: none; }
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    html, body { background: #fff; height: auto; }
    body > *:not(#sheet) { display: none !important; }
    #sheet { display: block; width: 277mm; font-size: 10pt; color: #000; }
    #sheet .pic { position: relative; overflow: hidden; border: 0.3mm solid #000; }
    #sheet .pic img { display: block; width: 100%; height: 100%; }
    #sheet .pic > div { position: absolute; inset: 0; }
    #sheet .block { display: flex; gap: 8mm; align-items: flex-end; margin-top: 3mm; }
    #sheet .block h1 { font-size: 13pt; margin: 0; }
    #sheet .block p { margin: 0.5mm 0 0; }
    #sheet .bar { display: flex; height: 2mm; border: 0.3mm solid #000; border-top: 0; }
    #sheet .bar i { flex: 1; } #sheet .bar i:nth-child(odd) { background: #000; }
    #sheet .nums { display: flex; justify-content: space-between; font-size: 8pt; }
    #sheet .src { font-size: 8pt; color: #333; margin-top: 2mm; }
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="title" class="card"><h1>Gamle Drammen sykehus</h1><p>Dronninggata 28 · gnr. 114 bnr. 272</p><p><a href="data/sykehus.ifc" download="gamle-drammen-sykehus.ifc" title="Fløyer, etasjer, vegger, dekker, vinduer og dører, med kilder; åpnes i FreeCAD, Solibri, Revit og andre BIM-verktøy">Last ned som BIM-modell (IFC, 12 MB)</a></p><p id="ideas" hidden><a href="#" id="ideasLink">Forslag til «etter»</a></p><p id="me" hidden><a href="#" id="loginLink">Logg inn</a></p></div>
<div id="north" class="card" title="Nord"><svg viewBox="-20 -20 40 40" aria-label="Nordpil"><path d="M0 -8 L7 17 L0 12 L-7 17 Z" fill="#23211e"/><text x="0" y="-10" text-anchor="middle" font-size="11" font-weight="700" fill="#23211e">N</text></svg></div>
<div id="scale" class="card"><div class="ticks"><i></i><i></i><i></i><i></i></div><div class="nums"><span>0</span><span id="scaleEnd"></span></div></div>
<div id="info" class="card"></div>
<div id="bar" class="card">
  <div class="group" id="floors"></div>
  <div class="sep"></div>
  <div class="group">
    <button id="m3d" aria-pressed="true">3D</button>
    <button id="mplan" aria-pressed="false">Plan</button>
    <button id="print" hidden title="Skriv ut det du ser som et ark, med målestokk og kilder">Skriv ut</button>
  </div>
</div>
<div id="sheet"></div>
<div id="zoom" class="card">
  <button id="zin" title="Zoom inn" aria-label="Zoom inn">+</button>
  <button id="zout" title="Zoom ut" aria-label="Zoom ut">−</button>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
